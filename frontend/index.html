<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Todo - Premium Task Management</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Tasks</h1>
            <p>Elevate your productivity</p>
        </header>

        <main>
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="What needs to be done?" required>
                <button type="submit" id="add-btn">Add Task</button>
            </form>

            <ul id="todo-list">
                <!-- Todos will be injected here -->
            </ul>
        </main>

        <footer>
            <div class="stats">
                <span id="task-count">0 tasks left</span>
            </div>
        </footer>
    </div>

    <script>
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const taskCount = document.getElementById('task-count');

        async function fetchTodos() {
            const res = await fetch('/api/todos');
            const todos = await res.json();
            renderTodos(todos);
        }

        function renderTodos(todos) {
            todoList.innerHTML = '';
            let activeCount = 0;
            
            todos.forEach(todo => {
                if (!todo.completed) activeCount++;
                
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                li.innerHTML = `
                    <div class="todo-content">
                        <div class="checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodo(${todo.id}, ${!todo.completed})"></div>
                        <span>${todo.title}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(${todo.id})">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                `;
                todoList.appendChild(li);
            });
            
            taskCount.innerText = `${activeCount} task${activeCount === 1 ? '' : 's'} left`;
        }

        todoForm.onsubmit = async (e) => {
            e.preventDefault();
            const title = todoInput.value.trim();
            if (!title) return;

            const res = await fetch('/api/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            if (res.ok) {
                todoInput.value = '';
                fetchTodos();
            }
        };

        async function toggleTodo(id, completed) {
            const res = await fetch('/api/todos/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, completed })
            });
            if (res.ok) fetchTodos();
        }

        async function deleteTodo(id) {
            const res = await fetch(`/api/todos/delete?id=${id}`, {
                method: 'POST'
            });
            if (res.ok) fetchTodos();
        }

        fetchTodos();
    </script>
</body>
</html>
