
services:
  # Go Application
  app:
    image: todo-app:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: todo-app-container
    hostname: todo-app-hostname
    ports:
      - "${PORT:-8082}:${PORT:-8080}"
    environment:
      - PORT=${PORT:-8080}
      - DB_PATH=/app/data/todos.db
    volumes:
      - ./data:/app/data
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge
